<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>혼밥 유저플로우 편집기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2c7a56;--bg:#e9ebe7}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:#1f2a24}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid #d8dbd6}
.bar button,.bar select{font:inherit;font-size:13px;padding:5px 10px;border:1px solid #c9cdc6;border-radius:6px;background:#fff;cursor:pointer;color:#222}
.bar button:hover{background:#f2f5f1}
.bar button.on{background:var(--g);color:#fff;border-color:var(--g)}
.bar button:disabled,.bar select:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:22px;background:#ddd;margin:0 4px}
.hint{width:100%;font-size:12px;color:#777}
#views{padding:12px;display:flex;gap:12px;align-items:flex-start}
.wrap{flex:1;min-width:0;position:relative;background:#fafaf8;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}
.stage{position:absolute;left:0;top:0;width:2000px;height:1130px;transform-origin:0 0;background:#fafaf8}
.edges{position:absolute;left:0;top:0;width:2000px;height:1130px;z-index:1;overflow:visible;pointer-events:none}
.edges .hit{pointer-events:stroke;cursor:pointer}
.labels{position:absolute;inset:0;z-index:3;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:17px;background:rgba(250,250,248,.92);padding:1px 6px;border-radius:4px;white-space:pre;pointer-events:auto;font-weight:500}
.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;border-radius:8px;padding:6px 10px}
.title{font-weight:700;font-size:22px;line-height:1.3;white-space:pre-wrap;min-width:10px}
.body{font-size:16.5px;line-height:1.45;color:#5b5f5c;white-space:pre-wrap;margin-top:4px;min-width:10px}
[contenteditable="true"]:hover{outline:1px dashed rgba(44,122,86,.5)}
[contenteditable="true"]:focus{outline:1.5px solid var(--g);background:rgba(255,255,255,.6)}
.t-user{background:#eaf5ef;border:1.5px solid #8fc5a9}.t-user .title{color:#2c7a56}
.t-auto{background:#efedfb;border:1.5px solid #b4abe3}.t-auto .title{color:#6655c4}
.t-ad{background:#fdf2e2;border:1.5px solid #e8c08a}.t-ad .title{color:#b06f22}
.t-gray{background:#f0f0ee;border:1.5px solid #c4c4c0}.t-gray .title{color:#333}
.t-plain{background:#fff;border:2px solid #444;border-radius:0}.t-plain .title{color:#111;font-size:23px}
.t-dashed{background:transparent;border:2px dashed #bdbdbd}.t-dashed .title{color:#444}
.t-dashed2{background:#f3f3f1;border:2px dashed #c9c9c9}.t-dashed2 .title{color:#555}
.t-pill{background:#efe9df;border:1.5px solid #cbbfa9;border-radius:999px}.t-pill .title{color:#3a3125}
.t-step{background:#fff;border:1.5px solid #cfcfcf}.t-step .title{color:#222;font-size:21px}.t-step .body{font-size:18px;margin-top:0}
.t-badge{background:#e7f3ec;border-radius:999px}.t-badge .title{color:#2c7a56;font-size:17px}
.t-diamond{background:transparent;border:none}
.t-diamond .shape{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.t-diamond .shape polygon{fill:#fff;stroke:#c9c9c9;stroke-width:1.5;vector-effect:non-scaling-stroke}
.t-diamond .title{font-size:20px;color:#222}.t-diamond .body{font-size:15px;margin-top:2px}
.t-text{background:none;border:none;padding:0;align-items:flex-start;justify-content:flex-start;text-align:left;border-radius:0}
.t-text.right{align-items:flex-end;text-align:right}
.t-lane{z-index:0;align-items:flex-start;justify-content:flex-start;text-align:left;border-radius:16px;padding:16px 24px}
.t-lane .title{font-size:20px;text-align:left}.t-lane .body{font-size:13px;color:#888;text-align:left}
.tone-green{background:#f2f7f3}.tone-green .title{color:#1f3d32}
.tone-purple{background:#f0eefa}.tone-purple .title{color:#222}
.tone-none{background:transparent}
.t-hr{background:#dcdcdc;padding:0;border-radius:0}
.swatch{padding:0;border-radius:5px}
.rh{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:#e0533d;border-radius:3px;cursor:nwse-resize;display:none}
body.m-move .node{cursor:move}
body.m-move .node.sel .rh{display:block}
body.m-connect .node{cursor:crosshair}
.node.sel{outline:2px dashed #e0533d;outline-offset:4px}
.node.src{outline:2px solid #e0533d;outline-offset:4px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#toast.show{opacity:.92}
</style>

</div>

const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>'x'+Math.random().toString(36).slice(2,8);
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s.d1&&s.d2)return s}}catch(e){}return null}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}},200)}
function snap(){history.push(JSON.stringify(state));if(history.length>80)history.shift()}
function undo(){if(!history.length)return toast('되돌릴 내용이 없어요');state=JSON.parse(history.pop());sel=null;save();render()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600)}
state=normalize(load()||clone(DEFAULTS));

function render(){
 const v=document.getElementById('views');v.innerHTML='';
 for(const k in stages)delete stages[k];
 const keys=view==='split'?['d1','d2']:[view];
 if(view!=='split')activeKey=view;
 keys.forEach(k=>{const wrap=document.createElement('div');wrap.className='wrap';const st=document.createElement('div');st.className='stage';st.dataset.key=k;wrap.appendChild(st);v.appendChild(wrap);stages[k]=st;buildStage(k)});
 fit();updateToolbar();
}
function fit(){for(const k in stages){const st=stages[k];const w=st.parentElement.clientWidth;const s=w/W;st._s=s;st.style.transform=`scale(${s})`;st.parentElement.style.height=(H*s)+'px'}}
new ResizeObserver(fit).observe(document.getElementById('views'));

function buildStage(k){
 const st=stages[k],d=state[k];st.innerHTML='';
 const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','edges');svg.setAttribute('viewBox','0 0 2000 1130');st.appendChild(svg);
 const lbl=document.createElement('div');lbl.className='labels';st.appendChild(lbl);
 d.nodes.forEach(n=>st.appendChild(makeNode(k,n)));
 drawEdges(k);
 st.addEventListener('pointerdown',ev=>{
  activeKey=k;
  if(ev.target.classList&&ev.target.classList.contains('hit')){select(k,'edge',ev.target.dataset.eid);return}
  if(ev.target===st){select(null);if(connectFrom){connectFrom=null;markSrc()}}
 });
}
function place(el,n){el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.width=n.w+'px';el.style.height=n.h+'px'}
function makeNode(k,n){
 const el=document.createElement('div');
 el.className='node t-'+n.type+(n.type==='lane'?' tone-'+(n.tone||'green'):'')+(n.swatch?' swatch':'')+(n.align==='right'?' right':'');
 el.dataset.id=n.id;place(el,n);
 if(n.type==='diamond')el.innerHTML='<svg class="shape" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="50,1 99,50 50,99 1,50"/></svg>';
 if(!n.swatch)['title','body'].forEach(f=>{
  if(n[f]===undefined)return;
  const t=document.createElement('div');t.className=f;t.textContent=n[f];t.contentEditable=mode==='text';t.spellcheck=false;
  if(n.type==='text'){if(n.fs)t.style.fontSize=n.fs+'px';if(n.color)t.style.color=n.color;if(n.fw)t.style.fontWeight=n.fw;if(n.italic)t.style.fontStyle='italic'}
  t.addEventListener('focus',()=>snap());
  t.addEventListener('input',()=>{n[f]=t.innerText.replace(/\n$/,'');save()});
  el.appendChild(t);
 });
 const rh=document.createElement('div');rh.className='rh';el.appendChild(rh);
 el.addEventListener('pointerdown',ev=>onNodeDown(ev,k,n,el,ev.target===rh));
 if(sel&&sel.k===k&&sel.kind==='node'&&sel.id===n.id)el.classList.add('sel');
 return el;
}
function onNodeDown(ev,k,n,el,resize){
 activeKey=k;ev.stopPropagation();
 if(mode==='text'){select(k,'node',n.id);return}
 ev.preventDefault();
 if(mode==='connect'){
  if(!connectFrom||connectFrom.k!==k){connectFrom={k,id:n.id};markSrc();toast('도착할 박스를 클릭하세요')}
  else if(connectFrom.id!==n.id){addEdge(k,connectFrom.id,n.id);connectFrom=null;markSrc()}
  return;
 }
 select(k,'node',n.id);snap();
 const s=stages[k]._s,sx=ev.clientX,sy=ev.clientY,ox=n.x,oy=n.y,ow=n.w,oh=n.h;let moved=false;
 el.setPointerCapture(ev.pointerId);
 const mv=e=>{moved=true;const dx=(e.clientX-sx)/s,dy=(e.clientY-sy)/s;
  if(resize){n.w=Math.max(16,Math.round((ow+dx)/5)*5);n.h=Math.max(1,Math.round((oh+dy)/5)*5)}
  else{n.x=Math.round((ox+dx)/5)*5;n.y=Math.round((oy+dy)/5)*5}
  place(el,n);drawEdges(k)};
 const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);if(moved)save();else history.pop()};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
}
function markSrc(){document.querySelectorAll('.node.src').forEach(e=>e.classList.remove('src'));if(connectFrom&&stages[connectFrom.k]){const el=stages[connectFrom.k].querySelector(`.node[data-id="${connectFrom.id}"]`);if(el)el.classList.add('src')}}

function anchor(n,side,at){at=at??.5;switch(side){case'r':return{x:n.x+n.w,y:n.y+n.h*at};case'l':return{x:n.x,y:n.y+n.h*at};case't':return{x:n.x+n.w*at,y:n.y};default:return{x:n.x+n.w*at,y:n.y+n.h}}}
function route(p1,s1,p2,s2,off){
 const hz=s=>s==='l'||s==='r';
 if(s1===s2){
  if(s1==='b'){const y=Math.max(p1.y,p2.y)+off;return[p1,{x:p1.x,y},{x:p2.x,y},p2]}
  if(s1==='t'){const y=Math.min(p1.y,p2.y)-off;return[p1,{x:p1.x,y},{x:p2.x,y},p2]}
  if(s1==='l'){const x=Math.min(p1.x,p2.x)-off;return[p1,{x,y:p1.y},{x,y:p2.y},p2]}
  const x=Math.max(p1.x,p2.x)+off;return[p1,{x,y:p1.y},{x,y:p2.y},p2];
 }
 if(hz(s1)&&hz(s2)){if(Math.abs(p1.y-p2.y)<1)return[p1,p2];const mx=(p1.x+p2.x)/2;return[p1,{x:mx,y:p1.y},{x:mx,y:p2.y},p2]}
 if(!hz(s1)&&!hz(s2)){if(Math.abs(p1.x-p2.x)<1)return[p1,p2];const my=(p1.y+p2.y)/2;return[p1,{x:p1.x,y:my},{x:p2.x,y:my},p2]}
 return hz(s1)?[p1,{x:p2.x,y:p1.y},p2]:[p1,{x:p1.x,y:p2.y},p2];
}
function midpoint(pts){let tot=0;for(let i=1;i<pts.length;i++)tot+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);let h=tot/2;
 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=Math.hypot(b.x-a.x,b.y-a.y);if(h<=l){const t=l?h/l:0;return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}h-=l}return pts[0]}
function drawEdges(k){
 const st=stages[k];if(!st)return;const d=state[k];const svg=st.querySelector('svg.edges'),lbl=st.querySelector('.labels');
 const byId=Object.fromEntries(d.nodes.map(n=>[n.id,n]));
 let html='<defs>'+COLOR_KEYS.map(c=>`<marker id="m-${k}-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${COLORS[c]}"/></marker>`).join('')+'</defs>';
 const seen=new Set();
 d.edges.forEach(e=>{
  const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
  const pts=route(anchor(a,e.fs,e.fromAt),e.fs,anchor(b,e.ts,e.toAt),e.ts,e.off??30);
  const ds='M'+pts.map(p=>p.x+','+p.y).join(' L');const c=COLORS[e.color]?e.color:'gray';const col=COLORS[c];
  const isSel=sel&&sel.k===k&&sel.kind==='edge'&&sel.id===e.id;
  html+=`<path d="${ds}" fill="none" stroke="${isSel?'#e0533d':col}" stroke-width="${isSel?3.5:2}" ${e.dash?'stroke-dasharray="7 6"':''} marker-end="url(#m-${k}-${c})" ${e.both?`marker-start="url(#m-${k}-${c})"`:''}/>`;
  html+=`<path class="hit" data-eid="${e.id}" d="${ds}" fill="none" stroke="transparent" stroke-width="16"/>`;
  if(e.label){
   const m=midpoint(pts);let el=lbl.querySelector(`[data-eid="${e.id}"]`);
   if(!el)el=makeLabel(k,e,lbl);
   el.style.left=(m.x+(e.ldx||0))+'px';el.style.top=(m.y+(e.ldy||0))+'px';el.style.color=col;seen.add(e.id);
  }
 });
 svg.innerHTML=html;
 lbl.querySelectorAll('.lbl').forEach(el=>{if(!seen.has(el.dataset.eid))el.remove()});
}
function makeLabel(k,e,lbl){
 const el=document.createElement('div');el.className='lbl';el.dataset.eid=e.id;el.textContent=e.label;el.contentEditable=mode==='text';el.spellcheck=false;
 el.addEventListener('focus',()=>snap());
 el.addEventListener('input',()=>{e.label=el.innerText.replace(/\n$/,'');save()});
 el.addEventListener('blur',()=>{if(!e.label.trim()){e.label='';drawEdges(k)}});
 el.addEventListener('pointerdown',ev=>{
  ev.stopPropagation();activeKey=k;select(k,'edge',e.id);if(mode!=='move')return;ev.preventDefault();snap();
  const s=stages[k]._s,sx=ev.clientX,sy=ev.clientY,ox=e.ldx||0,oy=e.ldy||0;el.setPointerCapture(ev.pointerId);
  const mv=m=>{e.ldx=Math.round(ox+(m.clientX-sx)/s);e.ldy=Math.round(oy+(m.clientY-sy)/s);drawEdges(k)};
  const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);save()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
 });
 lbl.appendChild(el);return el;
}
function select(k,kind,id){
 const prevEdgeK=sel&&sel.kind==='edge'?sel.k:null;
 sel=k?{k,kind,id}:null;
 document.querySelectorAll('.node.sel').forEach(e=>e.classList.remove('sel'));
 if(sel&&kind==='node'&&stages[k]){const el=stages[k].querySelector(`.node[data-id="${id}"]`);if(el)el.classList.add('sel')}
 if(prevEdgeK)drawEdges(prevEdgeK);if(sel&&kind==='edge')drawEdges(k);
 updateToolbar();
}
function curNode(){return sel&&sel.kind==='node'?state[sel.k].nodes.find(n=>n.id===sel.id):null}
function curEdge(){return sel&&sel.kind==='edge'?state[sel.k].edges.find(e=>e.id===sel.id):null}
function addEdge(k,a,b){
 const d=state[k],A=d.nodes.find(n=>n.id===a),B=d.nodes.find(n=>n.id===b);
 const dx=(B.x+B.w/2)-(A.x+A.w/2),dy=(B.y+B.h/2)-(A.y+A.h/2);
 const [fs,ts]=Math.abs(dx)>=Math.abs(dy)?(dx>0?['r','l']:['l','r']):(dy>0?['b','t']:['t','b']);
 snap();const e={id:uid(),from:a,to:b,fs,ts,color:'gray',label:''};d.edges.push(e);save();sel={k,kind:'edge',id:e.id};drawEdges(k);updateToolbar();toast('화살표를 추가했어요');
}
function del(){
 if(!sel)return;const d=state[sel.k];snap();
 if(sel.kind==='node'){d.nodes=d.nodes.filter(n=>n.id!==sel.id);d.edges=d.edges.filter(e=>e.from!==sel.id&&e.to!==sel.id)}
 else d.edges=d.edges.filter(e=>e.id!==sel.id);
 sel=null;save();render();
}

// toolbar
const addSel=document.getElementById('addType'),typeSel=document.getElementById('typeSel');
addSel.innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
typeSel.innerHTML='<option value="">모양 바꾸기…</option>'+Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;sel=null;connectFrom=null;render()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;connectFrom=null;document.body.className='m-'+mode;render()});
document.getElementById('addBtn').onclick=()=>{
 const t=addSel.value,k=activeKey;if(!stages[k])return;snap();
 const sizes={text:[320,40],lane:[700,160],diamond:[230,120],badge:[260,42],step:[231,82],pill:[170,110]};
 const [w,h]=sizes[t]||[260,100];
 const n={id:uid(),type:t,x:Math.round((W-w)/2),y:Math.round((H-h)/2),w,h,title:t==='text'?'텍스트':t==='lane'?'구역':'새 박스'};
 if(t==='text'){n.fs=18;n.color='#333';n.fw=500}else if(t!=='badge')n.body='설명';
 if(t==='lane'){n.tone='green';state[k].nodes.unshift(n)}else state[k].nodes.push(n);
 save();sel={k,kind:'node',id:n.id};buildStage(k);updateToolbar();toast('가운데에 추가했어요 · 이동 모드에서 옮기세요');
};
typeSel.onchange=()=>{const n=curNode();if(!n||!typeSel.value)return;snap();n.type=typeSel.value;if(n.type==='lane'&&!n.tone)n.tone='green';n.swatch=n.swatch&&n.type!=='text';save();buildStage(sel.k);updateToolbar()};
document.getElementById('colorBtn').onclick=()=>{const e=curEdge();if(e){snap();e.color=COLOR_KEYS[(COLOR_KEYS.indexOf(e.color)+1)%COLOR_KEYS.length];save();drawEdges(sel.k);return}
 const n=curNode();if(n&&n.type==='lane'){snap();const tones=['green','purple','none'];n.tone=tones[(tones.indexOf(n.tone)+1)%3];save();buildStage(sel.k)}};
document.getElementById('dashBtn').onclick=()=>{const e=curEdge();if(!e)return;snap();e.dash=!e.dash;save();drawEdges(sel.k)};
document.getElementById('labelBtn').onclick=()=>{const e=curEdge();if(!e)return;if(!e.label){snap();e.label='라벨';save();drawEdges(sel.k)}
 if(mode!=='text'){mode='text';document.body.className='m-text';render()}
 const el=stages[sel.k]&&stages[sel.k].querySelector(`.lbl[data-eid="${e.id}"]`);if(el){el.focus();document.execCommand('selectAll',false,null)}};
document.getElementById('delBtn').onclick=del;
document.getElementById('undoBtn').onclick=undo;
document.getElementById('resetBtn').onclick=()=>{if(!confirm('두 흐름 모두 처음 상태로 되돌릴까요? (되돌리기로 복구 가능)'))return;snap();state=normalize(clone(DEFAULTS));sel=null;save();render()};
function download(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.getElementById('jsonBtn').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));download(u,'honbap-userflow.json');setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.getElementById('importBtn').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!s.d1||!s.d2)throw 0;snap();state=normalize(s);sel=null;save();render();toast('불러왔어요')}catch(e){alert('올바른 JSON 파일이 아니에요')}ev.target.value=''};
document.getElementById('pngBtn').onclick=async()=>{
 if(typeof html2canvas==='undefined')return alert('PNG 라이브러리를 불러오지 못했어요 (인터넷 연결 확인)');
 const k=activeKey,st=stages[k];if(!st)return;const keep=sel;select(null);document.activeElement&&document.activeElement.blur();
 const prev=st.style.transform;st.style.transform='none';
 try{const c=await html2canvas(st,{backgroundColor:'#fafaf8',scale:1.5,width:W,height:H,windowWidth:W});download(c.toDataURL('image/png'),(k==='d1'?'userflow-상세':'userflow-AI에이전트')+'.png')}
 finally{st.style.transform=prev;fit()}
};
function updateToolbar(){
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
 const n=curNode(),e=curEdge();
 typeSel.disabled=!n;typeSel.value=n?n.type:'';
 document.getElementById('colorBtn').disabled=!(e||(n&&n.type==='lane'));
 document.getElementById('dashBtn').disabled=!e;document.getElementById('labelBtn').disabled=!e;
 document.getElementById('delBtn').disabled=!sel;
 const hints={text:'글자를 클릭해서 바로 고치세요. 줄바꿈은 Enter. 화살표를 클릭하면 선택돼요.',move:'박스를 끌어 옮기고, 선택 후 오른쪽 아래 빨간 점으로 크기 조절. 라벨도 끌어서 위치 조정. 방향키로 미세 이동, Delete로 삭제.',connect:'출발 박스 → 도착 박스 순서로 클릭하면 화살표가 생겨요.'};
 document.getElementById('hint').textContent=hints[mode]+'  ·  변경 내용은 이 브라우저에 자동 저장돼요.';
}
document.addEventListener('keydown',ev=>{
 const editing=document.activeElement&&document.activeElement.isContentEditable;
 if(editing){if(ev.key==='Escape')document.activeElement.blur();return}
 if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();undo();return}
 if(ev.key==='Escape'){connectFrom=null;markSrc();select(null);return}
 if((ev.key==='Delete'||ev.key==='Backspace')&&sel){ev.preventDefault();del();return}
 const n=curNode();const dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
 if(n&&dirs[ev.key]){ev.preventDefault();const st=ev.shiftKey?10:1;n.x+=dirs[ev.key][0]*st;n.y+=dirs[ev.key][1]*st;const el=stages[sel.k].querySelector(`.node[data-id="${n.id}"]`);place(el,n);drawEdges(sel.k);save()}
});
render();
</script>
</body>
</html>
