<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탐색 에이전트 · 혼밥</title>
<style>
  :root {
    --ink: #1f1e1c; --sub: #6b6a66; --line: #e4e2dc; --bg: #faf9f6; --card: #fff;
    --agent-bg: #eeedfe; --agent: #534ab7;          /* 그림의 LLM 에이전트 색 */
    --tool-bg: #f1efe8;  --tool: #5f5e5a;           /* 도구 */
    --team-bg: #e1f5ee;  --team: #0f6e56;           /* 공유 상태 · 팀 데이터 */
    --warn-bg: #fdf0e9;  --warn: #b5481f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.5; }
  main { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 6px 0 0; color: var(--sub); }

  form { display: flex; gap: 8px; margin-top: 28px; }
  input { flex: 1; font: inherit; font-size: 17px; padding: 14px 16px; border: 1px solid var(--line);
          border-radius: 12px; background: #fff; outline: none; }
  input:focus { border-color: var(--agent); box-shadow: 0 0 0 3px var(--agent-bg); }
  button { font: inherit; font-weight: 600; padding: 0 22px; border: 0; border-radius: 12px;
           background: var(--agent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .examples span { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: #fff;
                   border: 1px solid var(--line); color: var(--sub); cursor: pointer; }
  .examples span:hover { border-color: var(--agent); color: var(--agent); }

  h2 { font-size: 15px; color: var(--sub); font-weight: 600; margin: 36px 0 12px; }

  /* 단계 */
  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .step { position: relative; border-radius: 14px; padding: 14px 14px 16px; background: #fff;
          border: 1px solid var(--line); min-height: 128px; }
  .step:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 50%;
          transform: translate(50%, -50%); color: #b8b6b0; font-size: 15px; z-index: 1; }
  .step .who { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; display: inline-block; }
  .step .title { font-weight: 700; margin: 8px 0 4px; }
  .step .desc { font-size: 13.5px; color: var(--sub); }
  .step .desc b { color: var(--ink); }
  .who.orch { background: var(--agent-bg); color: var(--agent); }
  .who.team { background: var(--team-bg); color: var(--team); }
  .who.mine { background: var(--agent); color: #fff; }
  .who.out  { background: var(--tool-bg); color: var(--tool); }
  .step.done { border-color: #cfcbe9; }
  .step.mine.done { border: 2px solid var(--agent); }
  .step.skip { background: transparent; border-style: dashed; }
  .step.skip .title, .step.skip .desc { color: #a3a19b; }
  .step.stop { border-color: #f0c9b6; background: var(--warn-bg); }
  .step.idle .desc { color: #b8b6b0; }
  .loading .step:not(.skip) { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* 결과 */
  .verdict { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 14px;
             background: #fff; border: 1px solid var(--line); }
  .verdict .tag { flex: none; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 8px; }
  .verdict .msg { white-space: pre-line; }
  .tag.found { background: var(--agent-bg); color: var(--agent); }
  .tag.team { background: var(--team-bg); color: var(--team); }
  .tag.ask { background: #fff6d8; color: #8a6400; }
  .tag.none { background: var(--warn-bg); color: var(--warn); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card .nm { font-weight: 700; font-size: 16.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 10px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--tool-bg); color: var(--tool); }
  .chip.in { background: var(--team-bg); color: var(--team); font-weight: 600; }
  .chip.out { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; font-size: 13.5px; }
  dt { color: var(--sub); }
  dd { margin: 0; word-break: keep-all; }
  .card a { margin-top: 12px; align-self: flex-start; font-size: 13px; font-weight: 600; color: var(--agent);
            text-decoration: none; border: 1px solid #cfcbe9; padding: 6px 10px; border-radius: 8px; }
  .card a:hover { background: var(--agent-bg); }
  .note { font-size: 12.5px; color: var(--sub); margin-top: 10px; }

  details { margin-top: 28px; }
  summary { cursor: pointer; color: var(--sub); font-size: 14px; }
  pre { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 12.5px;
        white-space: pre-wrap; margin: 10px 0 0; }
  .err { color: var(--warn); margin-top: 16px; }
  #result[hidden], #flowWrap[hidden] { display: none; }

  @media (max-width: 720px) {
    .flow { grid-template-columns: 1fr 1fr; }
    .step:nth-child(2)::after { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>탐색 에이전트</h1>
    <p>가게에 대해 무엇을 물어도(혼밥 · 영업시간 · 위치 · 메뉴 …) 그 가게를 찾아 다음 에이전트에게 넘길 <b>후보 가게</b>를 모아요.</p>
  </header>

  <form id="f">
    <input id="q" placeholder="예: 한씨네 추어탕 혼밥 돼?" autocomplete="off">
    <button id="go">찾기</button>
  </form>
  <div class="examples" id="ex"></div>

  <div id="flowWrap" hidden>
    <h2>어떻게 찾았나</h2>
    <div class="flow" id="flow"></div>
  </div>

  <div id="result" hidden>
    <h2>탐색 결과 — 다음 에이전트(혼밥 분석)에게 넘기는 것</h2>
    <div class="verdict" id="verdict"></div>
    <div class="cards" id="cards"></div>
    <details><summary>에이전트 기록 보기</summary><pre id="log"></pre></details>
  </div>
  <div class="err" id="err"></div>
</main>

<script>
const EXAMPLES = [
  "한씨네대가추어탕 혼밥 가능해?",
  "한씨네 추어탕 혼밥 돼?",
  "봉구스밥버거 경북대점 혼밥 가능해?",
  "청밭추어탕 혼밥?",
  "봉구스밥버거 반월당점 혼밥 가능해?",
  "추어탕집 혼밥 가능해?",
  "교동짬뽕 몇 시까지 해?",
  "을지로골뱅이 메뉴 뭐 있어?",
  "혼밥하기 좋은 한씨네대가추어탕",
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("ex").innerHTML = EXAMPLES.map(t => `<span>${esc(t)}</span>`).join("");
$("ex").onclick = e => { if (e.target.tagName === "SPAN") { $("q").value = e.target.textContent; run(); } };
$("f").onsubmit = e => { e.preventDefault(); run(); };

function step(cls, whoCls, who, title, desc) {
  return `<div class="step ${cls}"><span class="who ${whoCls}">${who}</span>
    <div class="title">${title}</div><div class="desc">${desc}</div></div>`;
}

function drawFlow(d) {
  const s = [];
  // ① 이름 꺼내기
  s.push(d.name
    ? step("done", "orch", "오케스트레이터", "① 가게 이름 꺼내기",
        `<b>${esc(d.name)}</b>${d.gu ? ` · ${esc(d.gu)}` : ""}<br>질문 종류: ${esc(d.intent || "모름")}`)
    : step("stop", "orch", "오케스트레이터", "① 가게 이름 꺼내기", "가게 이름이 아니에요<br>→ 조건 검색으로 넘김"));

  // ② 팀 데이터
  if (!d.name) s.push(step("skip", "team", "팀 데이터", "② 팀 데이터 확인", "하지 않음"));
  else if (d.team.length === 1) s.push(step("done", "team", "팀 데이터", "② 팀 데이터 확인", "<b>1곳 있음</b> → 채택"));
  else if (d.team.length > 1) s.push(step("done", "team", "팀 데이터", "② 팀 데이터 확인", `<b>${d.team.length}곳</b> → 어느 가게인지 되물음`));
  else s.push(step("done", "team", "팀 데이터", "② 팀 데이터 확인", "<b>없음</b> → 탐색 에이전트에게"));

  // ③ 탐색 (내 담당)
  const searchLog = (d.log.find(l => l.includes("검색 '")) || "").replace(/^\[.*?\]\s*/, "");
  if (d.explore === null) {
    s.push(step("mine skip", "mine", "탐색 에이전트", "③ 지도에서 찾기", d.name ? "건너뜀<br>(팀 데이터에 있어서)" : "하지 않음"));
  } else if (d.explore === "found" || d.explore === "ambiguous") {
    const linked = d.candidates.filter(c => c.in_team).length;
    s.push(step("mine done", "mine", "탐색 에이전트", "③ 지도에서 찾기",
      `${esc(searchLog.replace(/^.*?검색 '.*?':\s*/, ""))}${linked ? `<br><b>팀 데이터와 이어진 곳 ${linked}곳</b>` : ""}`));
  } else {
    s.push(step("mine stop", "mine", "탐색 에이전트", "③ 지도에서 찾기",
      d.explore === "no_key" ? "지도 API 키가 없어요" : esc(searchLog.replace(/^.*?검색 '.*?':\s*/, "")) || "못 찾음"));
  }

  // ④ 결과
  const OUT = { team: "팀 가게 1곳", found: "후보 1곳", ambiguous: "되묻기", not_found: "못 찾음", no_key: "찾을 수 없음", not_name: "조건 검색으로" };
  s.push(step(["not_found", "no_key", "not_name"].includes(d.outcome) ? "stop" : "done",
    "out", "결과", "④ 넘겨주는 것", `<b>${OUT[d.outcome]}</b><br>${d.candidates.length ? `가게 카드 ${d.candidates.length}장` : "가게 카드 없음"}`));
  $("flow").innerHTML = s.join("");
}

function drawResult(d) {
  const V = {
    team:      ["team",  "팀 데이터에서 채택", `'${d.name}'은(는) 팀 데이터에 있어서 탐색을 건너뛰었어요. 팀의 1인분 판정이 그대로 넘어가요.`],
    found:     ["found", "탐색이 찾음",       d.candidates[0]?.in_team
                  ? `팀 데이터에서 바로 못 찾았지만, 지도에서 찾은 가게의 상호·주소가 팀 가게와 같아서 이어 붙였어요.`
                  : `팀 데이터에 없는 가게라 지도에서 찾았어요. 1인분 여부는 아직 몰라요.`],
    ambiguous: ["ask",   "되묻기",            d.ask],
    not_found: ["none",  "못 찾음",           d.ask],
    no_key:    ["none",  "찾을 수 없음",      d.ask],
    not_name:  ["none",  "가게 이름 아님",    `'${d.text}'에는 가게 이름이 없어요. 음식 이름만 있으면 조건 검색(다른 흐름)으로 넘어가요.`],
  }[d.outcome];
  $("verdict").innerHTML = `<span class="tag ${V[0]}">${V[1]}</span><div class="msg">${esc(V[2])}</div>`;

  $("cards").innerHTML = d.candidates.map(c => `
    <div class="card">
      <div class="top"><span class="nm">${esc(c.name)}</span></div>
      <div class="chips">
        <span class="chip ${c.in_team ? "in" : "out"}">${c.in_team ? "팀 데이터 있음" : "팀 데이터 없음"}</span>
        <span class="chip">찾은 곳: ${esc(c.found_by)}</span>
        ${c.link ? `<span class="chip">이음: ${esc(c.link)}</span>` : ""}
      </div>
      <dl>
        <dt>주소</dt><dd>${esc(c.addr) || "—"}</dd>
        <dt>업종</dt><dd>${esc(c.category) || "—"}</dd>
        <dt>1인분</dt><dd>${esc(c.status_label)}</dd>
        <dt>좌표</dt><dd>${c.x ? `${c.x.toFixed(5)}, ${c.y.toFixed(5)}` : "없음 (상황 에이전트가 찾음)"}</dd>
      </dl>
      ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">카카오맵에서 보기 ↗</a>` : ""}
    </div>`).join("");
  $("log").textContent = d.log.join("\n") || "(기록 없음)";
}

async function run() {
  const text = $("q").value.trim();
  if (!text) return;
  $("err").textContent = "";
  $("go").disabled = true;
  $("flowWrap").hidden = false;
  $("flow").classList.add("loading");
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    drawFlow(d);
    drawResult(d);
    $("result").hidden = false;
  } catch (e) {
    $("err").textContent = "오류: " + e.message;
  } finally {
    $("go").disabled = false;
    $("flow").classList.remove("loading");
  }
}
</script>
</body>
</html>
