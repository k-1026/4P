<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>혼밥 피칭 8쪽 · 유저플로우 (960×540)</title>
<style>
/* 「혼밥 피피티.pdf」 한 쪽 = 960×540pt(16:9). 이 슬라이드도 960×540으로 그린다. */
@page { size: 960px 540px; margin: 0; }
:root{
  --bg:#FDFDFC; --navy:#22406E; --bar:#274A79; --panel:#F1F4F8; --line:#C9D2DF;
  --ink:#1B2B45; --sub:#5B6472; --mute:#8A93A2; --accent:#E0603A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d9dde3}
body{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.stage{width:960px;height:540px;position:relative;background:var(--bg);overflow:hidden;transform-origin:0 0}

/* 머리말 — 다른 쪽과 같은 자리 */
.brand{position:absolute;left:38px;top:22px;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--navy)}
.rule{position:absolute;top:53px;height:1.5px;background:var(--navy)}
.rule.l{left:38px;width:298px}.rule.r{left:623px;width:299px}
.nav{position:absolute;top:41px;left:336px;width:287px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--sub)}
.nav .sep{color:var(--mute);font-weight:400;font-size:9px}
.nav .on{background:var(--navy);color:#fff;border-radius:999px;padding:1px 9px}
.chip{position:absolute;right:38px;top:20px;background:var(--panel);color:var(--navy);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 11px}

.title{position:absolute;top:84px;left:0;width:960px;text-align:center;font-size:29px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.subtitle{position:absolute;top:128px;left:0;width:960px;text-align:center;font-size:14px;color:var(--sub)}

/* 내용 — 8쪽 '유저플로우 넣을 자리'(x 64~896, y 150~448)와 같은 칸 */
.content{position:absolute;left:64px;top:162px;width:832px;height:288px}
svg{display:block;width:832px;height:288px;overflow:visible}
svg text{font-family:inherit}
.n{fill:var(--panel);stroke:none}
.n.main{fill:var(--navy)}
.n.end{fill:#fff;stroke:var(--navy);stroke-width:1.6}
.n.dash{fill:#fff;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 3}
.d{fill:#fff;stroke:var(--navy);stroke-width:1.6}
.t{font-size:13px;font-weight:800;fill:var(--navy);text-anchor:middle}
.t.w{fill:#fff}
.s{font-size:10px;fill:var(--sub);text-anchor:middle}
.s.w{fill:#D9E2F0}
.num{font-size:10px;font-weight:800;fill:#fff;text-anchor:middle}
.numc{fill:var(--accent)}
.a{stroke:var(--navy);stroke-width:1.6;fill:none}
.a.dash{stroke-dasharray:4 3;stroke:var(--mute)}
.lb{font-size:9.5px;fill:var(--sub)}
.lb.b{font-weight:700;fill:var(--navy)}
.leg{font-size:9.5px;fill:var(--mute)}

.src{position:absolute;left:38px;top:478px;font-size:11px;color:var(--sub)}
.pg{position:absolute;right:38px;top:474px;font-size:14px;font-weight:800;color:var(--navy)}
.bar{position:absolute;left:0;bottom:0;width:960px;height:22px;background:var(--bar)}

@media print{ html,body{background:var(--bg)} .stage{transform:none!important;margin:0!important} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="brand">혼밥 · 팀 4P</div>
  <div class="rule l"></div><div class="rule r"></div>
  <div class="nav"><span>문제</span><span class="sep">›</span><span class="on">해결</span><span class="sep">›</span><span>시장</span><span class="sep">›</span><span>BM</span><span class="sep">›</span><span>MVP</span></div>
  <div class="chip">피치 2 · 해결</div>

  <div class="title">유저플로우 — 순위 고르고, 밥톨이 상의 보고, 3곳 중 하나로 간다</div>
  <div class="subtitle">실제 웹 ‘혼밥 밥친구’를 휴대폰 화면으로 직접 써 본 순서 (2026-11-26)</div>

  <div class="content">
  <svg viewBox="0 0 832 288" role="img" aria-label="유저플로우: 중요 순위 고르기, 업종·예산, 위치 허용 갈림길, 밥톨이 상의, 의견 갈림 갈림길, 최종 3곳과 검증, 가게 상세, 길찾기">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22406E"/></marker>
      <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A2"/></marker>
    </defs>

    <!-- ── 1줄: 추천 받기 (주 경로) ── -->
    <!-- ① 중요 순위 -->
    <rect class="n" x="0" y="34" width="118" height="72" rx="10"/>
    <circle class="numc" cx="11" cy="45" r="7.5"/><text class="num" x="11" y="48.5" style="font-size:9px">1</text>
    <text class="t" x="59" y="69">중요 순위 고르기</text>
    <text class="s" x="59" y="82">거리·자리·가격·날씨·</text>
    <text class="s" x="59" y="95">새로움 5개를 순서대로</text>
    <path class="a" d="M118,70 H138" marker-end="url(#ar)"/>

    <!-- ② 업종·예산 -->
    <rect class="n" x="140" y="34" width="112" height="72" rx="10"/>
    <circle class="numc" cx="151" cy="45" r="7.5"/><text class="num" x="151" y="48.5" style="font-size:9px">2</text>
    <text class="t" x="196" y="69">업종 · 예산</text>
    <text class="s" x="196" y="82">예: 한식 · 1만원 이하</text>
    <text class="s" x="196" y="95">→ ‘추천 시작’</text>
    <path class="a" d="M252,70 H270" marker-end="url(#ar)"/>

    <!-- ◇ 위치 -->
    <polygon class="d" points="310,40 350,70 310,100 270,70"/>
    <text class="t" x="310" y="67" style="font-size:11px">위치</text>
    <text class="t" x="310" y="81" style="font-size:11px">허용?</text>
    <path class="a" d="M350,70 H370" marker-end="url(#ar)"/>
    <text class="lb b" x="360" y="62" text-anchor="middle">예</text>
    <text class="lb" x="310" y="118" text-anchor="middle">아니오 → 동성로 중심</text>
    <text class="lb" x="310" y="130" text-anchor="middle">거리로 계속</text>

    <!-- ③ 밥톨이 상의 -->
    <rect class="n main" x="372" y="26" width="150" height="88" rx="10"/>
    <circle class="numc" cx="383" cy="37" r="7.5"/><text class="num" x="383" y="40.5" style="font-size:9px">3</text>
    <text class="t w" x="447" y="58">밥톨이 상의</text>
    <text class="s w" x="447" y="75">날씨·취향·거리·혼밥·가격·메뉴</text>
    <text class="s w" x="447" y="89">1km 안 후보 20곳 → 탈락 확인</text>
    <text class="s w" x="447" y="103">→ 1차 점수 (10점 만점)</text>
    <path class="a" d="M522,70 H540" marker-end="url(#ar)"/>

    <!-- ◇ 의견 갈림 -->
    <polygon class="d" points="582,36 624,70 582,104 540,70"/>
    <text class="t" x="582" y="67" style="font-size:11px">1·2위</text>
    <text class="t" x="582" y="81" style="font-size:11px">갈리나?</text>
    <path class="a" d="M624,70 H660" marker-end="url(#ar)"/>
    <text class="lb b" x="642" y="62" text-anchor="middle">아니오</text>
    <text class="lb" x="582" y="122" text-anchor="middle">예 → 반론 1회 후</text>
    <text class="lb" x="582" y="134" text-anchor="middle">사용자가 직접 고름</text>
    <path class="a" d="M634,128 H660 V108" marker-end="url(#ar)"/>

    <!-- ④ 최종 3곳 -->
    <rect class="n main" x="662" y="26" width="170" height="80" rx="10"/>
    <circle class="numc" cx="673" cy="37" r="7.5"/><text class="num" x="673" y="40.5" style="font-size:9px">4</text>
    <text class="t w" x="747" y="58">최종 추천 3곳</text>
    <text class="s w" x="747" y="75">도보 분 · 1인 가격 · 총점 · 이유</text>
    <text class="s w" x="747" y="89">‘AI 추천’ 라벨 · 검증 8/8 통과</text>

    <!-- ── 2줄: 가게 고르고 가기 ── -->
    <!-- 시작 -->
    <rect class="n end" x="0" y="186" width="118" height="40" rx="20"/>
    <text class="t" x="59" y="203" style="font-size:12px">시작</text>
    <text class="s" x="59" y="217">휴대폰 웹 접속</text>
    <path class="a" d="M59,186 V110" marker-end="url(#ar)"/>
    <text class="lb" x="66" y="150">첫 화면</text>
    <text class="lb" x="66" y="162">‘AI 추천’</text>
    <path class="a" d="M118,206 H370" marker-end="url(#ar)"/>
    <text class="lb" x="244" y="199" text-anchor="middle">아래 ‘지도’ 탭</text>

    <!-- 지도 탭 -->
    <rect class="n" x="372" y="176" width="150" height="60" rx="10"/>
    <text class="t" x="447" y="200">지도 · 가까운 순</text>
    <text class="s" x="447" y="216">혼밥 좋아요 수 · 대표 메뉴 · 가격</text>
    <path class="a" d="M522,206 H660" marker-end="url(#ar)"/>
    <text class="lb" x="591" y="199" text-anchor="middle">가게 누르기</text>

    <!-- ⑤ 가게 상세 -->
    <path class="a dash" d="M747,106 V174" marker-end="url(#arg)"/>
    <text class="lb" x="754" y="138">카드 누르기</text>
    <text class="lb" x="754" y="150">(확인 중)</text>
    <rect class="n" x="662" y="176" width="170" height="60" rx="10"/>
    <circle class="numc" cx="673" cy="187" r="7.5"/><text class="num" x="673" y="190.5" style="font-size:9px">5</text>
    <text class="t" x="747" y="198">가게 상세</text>
    <text class="s" x="747" y="213">1인 메뉴 · 가격 · 혼밥 후기 수</text>
    <text class="s" x="747" y="226">‘AI 확인 · 사람 확인 전’ 라벨</text>

    <!-- 끝 -->
    <path class="a" d="M747,236 V252" marker-end="url(#ar)"/>
    <rect class="n end" x="662" y="254" width="170" height="30" rx="15"/>
    <text class="t" x="747" y="274" style="font-size:12px">끝 · 길찾기(카카오맵)</text>
    <!-- 곁가지 -->
    <rect class="n dash" x="372" y="254" width="150" height="30" rx="8"/>
    <text class="s" x="447" y="273" style="font-size:10.5px">방문 기록 → 혼밥일기 · 찜 → 마이</text>
    <path class="a dash" d="M662,269 H524" marker-end="url(#arg)"/>

    <!-- 범례 -->
    <text class="leg" x="0" y="262">◇ 갈림길 · 진한 상자 = 에이전트가 일하는 단계</text>
    <text class="leg" x="0" y="276">점선 = 곁가지 또는 아직 확인 중인 길</text>
  </svg>
  </div>

  <div class="src">출처: 10_에이전트/spec/userflow.md v1 · honbap-bapchingu.vercel.app (2026-11-26 직접 확인)</div>
  <div class="pg">8</div>
  <div class="bar"></div>
</div>
<script>
// 화면에서는 창 크기에 맞춰 키우고, 인쇄·PDF 저장 때는 960×540 그대로 나간다.
(function(){
  const s=document.getElementById('stage');
  function fit(){
    const k=Math.min(innerWidth/960, innerHeight/540);
    s.style.transform='scale('+k+')';
    s.style.marginLeft=Math.max(0,(innerWidth-960*k)/2)+'px';
    s.style.marginTop=Math.max(0,(innerHeight-540*k)/2)+'px';
  }
  addEventListener('resize',fit); fit();
})();
</script>
</body>
</html>
